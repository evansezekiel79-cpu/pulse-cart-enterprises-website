<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Cart Enterprises | Discover Tech</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.cart-button{
  background:#2563eb;
  color:white;
  border:0;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  padding:70px 5%;
  text-align:center;
}

.hero h1{
  font-size:48px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  max-width:650px;
  margin:auto;
  line-height:1.6;
}

.hero-buttons{
  margin-top:25px;
}

.hero-buttons button{
  padding:13px 22px;
  border:0;
  border-radius:9px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}

.shop-btn{
  background:white;
  color:#2563eb;
}

.about-btn{
  background:transparent;
  color:white;
  border:1px solid white !important;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  max-width:900px;
  margin:-35px auto 35px;
  padding:0 20px;
  position:relative;
}

.stat{
  background:white;
  padding:25px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.stat h2{
  color:#2563eb;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

.section-title{
  text-align:center;
  margin:45px 0 25px;
}

.search-box{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:10px;
  margin-bottom:18px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.category{
  border:1px solid #d1d5db;
  background:white;
  padding:10px 17px;
  border-radius:20px;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.product{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
}

.product-image{
  height:190px;
  background:linear-gradient(135deg,#e5e7eb,#f9fafb);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.product-info{
  padding:18px;
}

.product-category{
  color:#2563eb;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
}

.product h3{
  margin:8px 0;
  min-height:42px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin:10px 0;
}

.add-btn{
  width:100%;
  padding:12px;
  border:0;
  background:#111827;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:hover{
  background:#2563eb;
}

.why{
  margin:70px 0;
}

.why-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.why-card{
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.why-card div{
  font-size:40px;
  margin-bottom:10px;
}

footer{
  background:#111827;
  color:white;
  padding:45px 5%;
  margin-top:60px;
  text-align:center;
}

footer p{
  margin:8px;
  color:#d1d5db;
}

/* CART */

.cart-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:2000;
}

.cart{
  position:absolute;
  right:0;
  top:0;
  width:100%;
  max-width:430px;
  height:100%;
  background:white;
  padding:22px;
  overflow-y:auto;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close-cart{
  border:0;
  background:#ef4444;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #e5e7eb;
}

.cart-item-image{
  width:65px;
  height:65px;
  background:#f3f4f6;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.cart-item-info{
  flex:1;
}

.cart-item-info h4{
  font-size:14px;
  margin-bottom:5px;
}

.cart-price{
  font-weight:bold;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.quantity button{
  border:0;
  background:#e5e7eb;
  width:28px;
  height:28px;
  border-radius:5px;
  cursor:pointer;
}

.remove{
  color:#ef4444;
  background:none !important;
  width:auto !important;
}

.cart-total{
  margin-top:25px;
  padding-top:20px;
  border-top:2px solid #111827;
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
}

.whatsapp-order{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.clear-cart{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #ef4444;
  border-radius:10px;
  background:white;
  color:#ef4444;
  cursor:pointer;
}

.empty-cart{
  text-align:center;
  padding:50px 10px;
  color:#6b7280;
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .why-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .hero h1{
    font-size:36px;
  }

  .stats{
    grid-template-columns:1
