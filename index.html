<!DOCTYPE html>
<html lang="en">
<head>

<title>Pulse Cart Enterprises | Tech Store Abuja</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#050505;
    color:#ffffff;
    line-height:1.6;
}

a{
    text-decoration:none;
}

img{
    max-width:100%;
    display:block;
}

/* HEADER */

header{
    background:#080808;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar{
    max-width:1150px;
    margin:auto;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#fff;
}

.logo span{
    color:#168cff;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#aaa;
    font-size:14px;
    font-weight:600;
}

nav a:hover{
    color:#168cff;
}

/* HERO */

.hero{
    min-height:520px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:70px 20px;
    background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.85)),
    url("https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:750px;
}

.small-title{
    color:#168cff;
    font-size:13px;
    letter-spacing:3px;
    font-weight:bold;
    margin-bottom:15px;
}

.hero h1{
    font-size:58px;
    line-height:1.05;
    margin-bottom:20px;
}

.hero h1 span{
    color:#168cff;
}

.hero p{
    color:#bbb;
    font-size:17px;
    max-width:650px;
    margin:0 auto 30px;
}

.button{
    display:inline-block;
    padding:14px 24px;
    border-radius:8px;
    font-weight:bold;
    margin:5px;
}

.blue-button{
    background:#168cff;
    color:#fff;
}

.whatsapp-button{
    background:#20c463;
    color:#fff;
}

.dark-button{
    background:#151515;
    border:1px solid #333;
    color:#fff;
}

/* GENERAL */

.container{
    max-width:1150px;
    margin:auto;
    padding:70px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}
