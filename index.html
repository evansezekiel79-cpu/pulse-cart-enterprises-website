<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulse Cart Enterprises</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#05070a;
  color:#fff;
  line-height:1.5;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  max-width:100%;
}

/* HEADER */

header{
  background:#090b0f;
  border-bottom:1px solid #252a30;
  padding:18px 5%;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:23px;
  font-weight:bold;
  white-space:nowrap;
}

.logo span{
  color:#2196f3;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:#bbb;
  font-size:14px;
}

nav a:hover{
  color:#2196f3;
}

.cart{
  background:#151a20;
  border:1px solid #333;
  padding:10px 15px;
  border-radius:8px;
  font-size:14px;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  min-height:600px;
  padding:80px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:50px;
}

.hero-text{
  flex:1;
}

.badge{
  display:inline-block;
  color:#2196f3;
  border:1px solid #2196f3;
  padding:8px 14px;
  border-radius:30px;
  font-size:12px;
  margin-bottom:20px;
  letter-spacing:1px;
}

h1{
  font-size:70px;
  line-height:1;
  margin-bottom:25px;
}

h1 span{
  color:#2196f3;
}

.hero p{
  color:#999;
  font-size:18px;
  line-height:1.7;
  max-width:550px;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  background:#2196f3;
  padding:14px 22px;
  border-radius:8px;
  font-weight:bold;
  margin-right:10px;
  margin-bottom:10px;
}

.btn.dark{
  background:#151a20;
  border:1px solid #333;
}

.hero-image{
  flex:1;
  min-height:430px;
  border-radius:25px;
  background-image:url("https://images.unsplash.com/photo-1468495244123-6c6c332eeece?auto=format&fit=crop&w=1000&q=80");
  background-size:cover;
  background-position:center;
  border:1px solid #333;
}

/* GENERAL SECTION */

section{
  max-width:1200px;
  margin:auto;
  padding:70px 5%;
}

.section-title{
  margin-bottom:35px;
}

.section-title small{
  color:#2196f3;
  text-transform:uppercase;
  font-weight:bold;
  letter-spacing:1px;
}

.section-title h2{
  font-size:38px;
  margin:8px 0;
}

.section-title p{
  color:#777;
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
}

.category{
  background:#101419;
  border:1px solid #292f35;
  padding:25px;
  border-radius:15px;
  text-align:center;
  transition:.2s;
}

.category:hover{
  border-color:#2196f3;
  transform:translateY(-3px);
}

.category .icon{
  font-size:40px;
  margin-bottom:15px;
}

.category p{
  color:#777;
  margin-top:7px;
  font-size:13px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#101419;
  border:1px solid #292f35;
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  border-color:#2196f3;
  transform:translateY(-3px);
}

.product-image{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
  background:#171b20;
}

.product-info{
  padding:17px;
}

.product-category{
  color:#2196f3;
  font-size:11px;
  text-transform:uppercase;
  font-weight:bold;
}

.product h3{
  font-size:16px;
  margin:10px 0;
  min-height:48px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin-bottom:15px;
}

.order{
  display:block;
  width:100%;
  text-align:center;
  background:#2196f3;
  padding:12px;
  border-radius:7px;
  font-weight:bold;
}

.order:hover{
  background:#1684dc;
}

/* FEATURES */

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature{
  background:#101419;
  border:1px solid #292f35;
  border-radius:15px;
  padding:25px;
}

.feature-icon{
  font-size:30px;
  margin-bottom:15px;
}

.feature p{
  color:#777;
  font-size:13px;
  margin-top:8px;
  line-height:1.6;
}

/* ABOUT */

.about{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
}

.about-image{
  height:400px;
  border-radius:20px;
  background-image:url("https://images.unsplash.com/photo-1517336714739-489689fd1ca8?auto=format&fit=crop&w=1000&q=80");
  background-size:cover;
  background-position:center;
}

.about-text p{
  color:#999;
  line-height:1.8;
  margin-bottom:15px;
}

/* CONTACT */

.contact-box{
  background:#101419;
  border:1px solid #292f35;
  border-radius:18px;
  padding:30px;
}

.contact-item{
  padding:18px 0;
  border-bottom:1px solid #292f35;
}

.contact-item:last-child{
  border-bottom:0;
}

.contact-item small{
  display:block;
  color:#777;
  margin-bottom:6px;
}

/* WHATSAPP */

.whatsapp-box{
  margin-top:25px;
}

.whatsapp{
  display:inline-block;
  background:#20c463;
  color:white;
  padding:14px 22px;
  border-radius:8px;
  font-weight:bold;
}

/* FOOTER */

footer{
  border-top:1px solid #292f35;
  padding:40px 5%;
  text-align:center;
  color:#777;
}

footer .logo{
  color:white;
  margin-bottom:10px;
}

footer span{
  color:#2196f3;
}

/* MOBILE */

@media(max-width:900px){

  nav{
    display:none;
  }

  .hero{
    flex-direction:column;
    padding-top:55px;
  }

  .hero-text{
    width:100%;
  }

  h1{
    font-size:55px;
  }

  .hero-image{
    width:100%;
    min-height:320px;
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .features{
    grid-template-columns:repeat(2,1fr);
  }

  .about{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding:15px;
  }

  .logo{
    font-size:20px;
  }

  .cart{
    padding:8px 10px;
    font-size:12px;
  }

  .hero{
    padding:50px 15px;
    min-height:auto;
  }

  h1{
    font-size:46px;
  }

  .hero p{
    font-size:16px;
  }

  .hero-image{
    min-height:270px;
  }

  section{
    padding:50px 15px;
  }

  .section-title h2{
    font-size:30px;
  }

  .categories{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .category{
    padding:18px 10px;
  }

  .category .icon{
    font-size:32px;
  }

  .products{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .product-image{
    height:150px;
  }

  .product-info{
    padding:12px;
  }

  .product h3{
    font-size:13px;
    min-height:58px;
  }

  .price{
    font-size:15px;
  }

  .order{
    font-size:12px;
    padding:10px 5px;
  }
