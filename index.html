<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Pulse Cart Enterprises | Tech Store</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
  line-height:1.5;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,5,5,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #242424;
}

.navbar{
  max-width:1250px;
  margin:auto;
  min-height:70px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#3fa9ff;
}

.nav-links{
  display:flex;
  gap:28px;
}

.nav-links a{
  color:#ccc;
  font-size:14px;
}

.nav-links a:hover{
  color:#3fa9ff;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #333;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.cart-btn{
  position:relative;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-3px;
  width:19px;
  height:19px;
  background:#3fa9ff;
  color:#000;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
  font-weight:bold;
}

.menu-btn{
  display:none;
}

/* =========================
   SEARCH
========================= */

.search-box{
  display:none;
  max-width:1250px;
  margin:auto;
  padding:0 20px 15px;
}

.search-box.show{
  display:block;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  background:#111;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
}

.search-box input:focus{
  border-color:#3fa9ff;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:1250px;
  min-height:650px;
  margin:auto;
  padding:70px 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:45px;
}

.hero-content small{
  color:#3fa9ff;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:bold;
}

.hero-content h1{
  font-size:clamp(45px,6vw,76px);
  line-height:1;
  letter-spacing:-3px;
  margin:18px 0;
}

.hero-content h1 span{
  color:#3fa9ff;
}

.hero-content p{
  color:#aaa;
  font-size:18px;
  max-width:540px;
  margin-bottom:28px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.btn{
  display:inline-block;
  padding:13px 21px;
  border-radius:9px;
  border:none;
  font-weight:bold;
}

.primary{
  background:#3fa9ff;
  color:#000;
}

.secondary{
  background:#151515;
  border:1px solid #3a3a3a;
  color:#fff;
}

.hero-image{
  height:460px;
  border-radius:25px;
  background:
    linear-gradient(120deg,rgba(0,0,0,.1),rgba(0,0,0,.35)),
    url("https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=1100&q=85")
    center/cover;
}

/* =========================
   SECTIONS
========================= */

.section{
  max-width:1250px;
  margin:auto;
  padding:70px 20px;
}

.section-title{
  margin-bottom:30px;
}

.section-title h2{
  font-size:35px;
  margin-bottom:5px;
}

.section-title p{
  color:#777;
}

/* =========================
   CATEGORIES
========================= */

.categories{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.category{
  min-height:145px;
  padding:20px;
  border-radius:17px;
  border:1px solid #252525;
  background:#101010;
  transition:.25s;
  cursor:pointer;
}

.category:hover{
  transform:translateY(-5px);
  border-color:#3fa9ff;
