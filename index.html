<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulse Cart Enterprises</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#05070a;
  color:#fff;
  line-height:1.5;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

header{
  background:#090b0f;
  border-bottom:1px solid #292f35;
  padding:16px 5%;
  position:sticky;
  top:0;
  z-index:1000;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#2196f3;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:#bbb;
  font-size:14px;
}

nav a:hover{
  color:#2196f3;
}

.cart-button{
  background:#151a20;
  color:white;
  border:1px solid #343a40;
  border-radius:8px;
  padding:10px 15px;
}

.cart-button:hover{
  border-color:#2196f3;
}

.cart-count{
  background:#2196f3;
  border-radius:20px;
  padding:3px 7px;
  margin-left:4px;
  font-size:11px;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  min-height:600px;
  padding:80px 5%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.badge{
  display:inline-block;
  color:#2196f3;
  border:1px solid #2196f3;
  padding:8px 14px;
  border-radius:30px;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
}

.hero h1{
  font-size:clamp(50px,7vw,78px);
  line-height:1;
  margin:20px 0;
  letter-spacing:-3px;
}

.hero h1 span{
  color:#2196f3;
}

.hero p{
  color:#999;
  font-size:18px;
  max-width:570px;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  background:#2196f3;
  color:white;
  padding:14px 22px;
  border-radius:8px;
  font-weight:bold;
}

.btn.dark{
  background:#151a20;
  border:1px solid #343a40;
}

.stats{
  display:flex;
  gap:35px;
  margin-top:40px;
}

.stats strong{
  display:block;
  font-size:22px;
}

.stats small{
  color:#777;
}

.hero-image{
  height:450px;
  border-radius:25px;
  border:1px solid #333;
  background-image:
    linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.65)),
    url("https://images.unsplash.com/photo-1468495244123-6c6c332eeece?auto=format&fit=crop&w=1200&q=80");
  background-size:cover;
  background-position:center;
}

/* SECTIONS */

.section{
  max-width:1200px;
  margin:auto;
  padding:70px 5%;
}

.heading{
  margin-bottom:30px;
}

.heading small{
  color:#2196f3;
  text-transform:uppercase;
  font-weight:bold;
  letter-spacing:1px;
}

.heading h2{
  font-size:38px;
  margin:7px 0;
}

.heading p{
  color:#777;
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
}

.category{
  background:#101419;
  border:1px solid #292f35;
  border-radius:15px;
  padding:25px;
  text-align:center;
  transition:.2s;
}

.category:hover{
  border-color:#2196f3;
  transform:translateY(-3px);
}

.category-icon{
  font-size:38px;
  margin-bottom:12px;
}

.category p{
  color:#777;
  font-size:13px;
}

/* SEARCH */

.search{
  width:100%;
  background:#101419;
  border:1px solid #30363d;
  color:white;
  border-radius:9px;
  padding:15px;
  outline:none;
  margin-bottom:15px;
}

.search:focus{
  border-color:#2196f3;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.filter{
  background:#101419;
  border:1px solid #343a40;
  color:#bbb;
  border-radius:25px;
  padding:9px 16px;
}

.filter.active,
.filter:hover{
  background:#2196f3;
  color:white;
  border-color:#2196f3;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#101419;
  border:1px solid #292f35;
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  border-color:#2196f3;
  transform:translateY(-3px);
}

.product-image{
  height:210px;
  background:#171b20;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:16px;
}

.product-category{
  color:#2196f3;
  font-size:10px;
  font-weight:bold;
  text-transform:uppercase;
}

.product h3{
  font-size:15px;
  margin:8px 0;
  min-height:45px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin:12px 0;
}

.add-cart{
  width:100%;
  border:0;
  background:#2196f3;
  color:white;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
}

.add-cart:hover{
  opacity:.85;
}

.no-results{
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:#777;
}

/* FEATURES */

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature{
  background:#101419;
  border:1px solid #292f35;
  border-radius:15px;
  padding:25px;
}

.feature-icon{
  font-size:30px;
  margin-bottom:12px;
}

.feature p{
  color:#777;
  font-size:13px;
  margin-top:8px;
}

/* ABOUT */

.about{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
}

.about-image{
  height:400px;
  border-radius:20px;
  background-image:
    linear
