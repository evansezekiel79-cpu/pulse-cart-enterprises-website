<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulse Cart Enterprises</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#05070a;
  color:white;
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  background:#090b0f;
  border-bottom:1px solid #252a30;
  padding:18px 5%;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#2196f3;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:#bbb;
}

nav a:hover{
  color:#2196f3;
}

.cart{
  background:#151a20;
  border:1px solid #333;
  padding:10px 15px;
  border-radius:8px;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  min-height:600px;
  padding:80px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:40px;
}

.hero-text{
  flex:1;
}

.badge{
  display:inline-block;
  color:#2196f3;
  border:1px solid #2196f3;
  padding:8px 14px;
  border-radius:30px;
  font-size:12px;
  margin-bottom:20px;
}

h1{
  font-size:70px;
  line-height:1;
  margin-bottom:25px;
}

h1 span{
  color:#2196f3;
}

.hero p{
  color:#999;
  font-size:18px;
  line-height:1.7;
  max-width:550px;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  background:#2196f3;
  padding:14px 22px;
  border-radius:8px;
  font-weight:bold;
  margin-right:10px;
}

.btn.dark{
  background:#151a20;
  border:1px solid #333;
}

.hero-image{
  flex:1;
  height:430px;
  border-radius:25px;
  background-image:url("https://images.unsplash.com/photo-1468495244123-6c6c332eeece?auto=format&fit=crop&w=1000&q=80");
  background-size:cover;
  background-position:center;
  border:1px solid #333;
}

/* SECTION */

section{
  max-width:1200px;
  margin:auto;
  padding:70px 5%;
}

.section-title{
  margin-bottom:35px;
}

.section-title small{
  color:#2196f3;
  text-transform:uppercase;
}

.section-title h2{
  font-size:38px;
  margin:8px 0;
}

.section-title p{
  color:#777;
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
}

.category{
  background:#101419;
  border:1px solid #292f35;
  padding:25px;
  border-radius:15px;
  text-align:center;
}

.category:hover{
  border-color:#2196f3;
}

.category .icon{
  font-size:40px;
  margin-bottom:15px;
}

.category p{
  color:#777;
  margin-top:7px;
  font-size:13px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
